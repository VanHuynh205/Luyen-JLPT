[package]
name = "luyen-jlpt-mobile"
version = "0.1.0"
description = "Tauri mobile shell for Luyện JLPT"
authors = ["Luyện JLPT"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "luyen_jlpt_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde_json = "1"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.3"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-http = "=2.9.0"
