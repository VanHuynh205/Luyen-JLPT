appId: vn.luyenjlpt.app
name: Denied account callback
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: '^Bắt đầu học$'
    timeout: 45000
- openLink: 'luyenjlpt://auth-callback?error=access_denied'
- assertVisible: '^Liên kết tài khoản không hợp lệ hoặc đã hết hạn\.$'
- assertVisible: '^Tài khoản$'
