name: Web Deploy

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "infra/**"
      - "wrangler.toml"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Validate Web Supabase environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node infra/scripts/src/validate-web-env.mjs
      - name: Build packs and Web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          pnpm packs:build
          pnpm packs:verify
          pnpm --filter @luyen/frontend build
      - name: Tighten dist security headers and verify embedded Supabase host
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";

            const supabaseOrigin = new URL(process.env.VITE_SUPABASE_URL.trim()).origin;
            const supabaseHost = new URL(supabaseOrigin).hostname;

            const headersPath = "frontend/dist/_headers";
            const headers = readFileSync(headersPath, "utf8");
            if (!headers.includes("https://*.supabase.co")) {
              throw new Error("Expected https://*.supabase.co placeholder in frontend/dist/_headers");
            }
            const tightened = headers.replaceAll("https://*.supabase.co", supabaseOrigin);
            if (tightened.includes("*.supabase.co")) {
              throw new Error("Wildcard *.supabase.co remained in frontend/dist/_headers");
            }
            writeFileSync(headersPath, tightened, "utf8");

            const assetsDir = "frontend/dist/assets";
            const jsFiles = readdirSync(assetsDir).filter((name) => name.endsWith(".js"));
            const embedded = jsFiles.some((name) =>
              readFileSync(join(assetsDir, name), "utf8").includes(supabaseHost),
            );
            if (!embedded) {
              throw new Error(`Built JS assets do not contain configured Supabase host ${supabaseHost}`);
            }
          '
      - name: Deploy Cloudflare Workers Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.14.4 deploy
