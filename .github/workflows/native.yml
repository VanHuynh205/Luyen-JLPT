name: Native apps

on:
  pull_request:
    paths:
      - '.github/workflows/native.yml'
      - 'desktop/**'
      - 'mobile/**'
      - 'frontend/**'
      - 'infra/**'
      - 'tests/desktop/**'
      - 'tests/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'backend/supabase/config.toml'
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish vX.Y.Z from its matching tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')"
          test "$version" = "$(node -p 'require("./mobile/src-tauri/tauri.conf.json").version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]
          if [[ "$PUBLISH" == true ]]; then
            test "$GITHUB_REPOSITORY" = VanHuynh205/Luyen-JLPT
            test "$GITHUB_REF" = "refs/tags/v$version"
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 55
    environment: ${{ inputs.publish && 'native-signing' || 'native-checks' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - run: pnpm install --frozen-lockfile
      - name: Build the bundled frontend
        env:
          VITE_SUPABASE_URL: ${{ inputs.publish && vars.NATIVE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.publish && vars.NATIVE_SUPABASE_PUBLISHABLE_KEY || '' }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          if ($env:PUBLISH -eq 'true') {
            node infra/scripts/src/validate-native-env.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pnpm --filter @luyen/frontend build
      - run: pnpm packs:verify
      - if: ${{ !inputs.publish }}
        run: pnpm tauri:desktop build --bundles nsis --ci '--' --locked
      - name: Compile release binary with updater configuration
        if: ${{ inputs.publish }}
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { throw 'Missing TAURI_UPDATER_PUBLIC_KEY' }
          $config = Get-Content desktop/src-tauri/tauri.release.conf.example.json -Raw | ConvertFrom-Json -AsHashtable
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY.Trim()
          $releaseConfig = Join-Path $env:RUNNER_TEMP 'luyen-jlpt-updater.json'
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $releaseConfig -Encoding utf8
          pnpm tauri:desktop build --no-bundle --ci --config $releaseConfig '--' --locked
      - name: Bundle and sign the Windows updater
        if: ${{ inputs.publish }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Missing Windows updater signing secrets' }
          $releaseConfig = Join-Path $env:RUNNER_TEMP 'luyen-jlpt-updater.json'
          pnpm tauri:desktop bundle --bundles nsis --ci --config $releaseConfig
      - name: Install matching WebDriver tools
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" |
            Sort-Object { [version]$_.Directory.Name } -Descending | Select-Object -First 1
          if (!$runtime) { throw 'WebView2 Runtime was not found' }
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $driverDir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Directory.Name)/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $driverDir
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $driverDir 'msedgedriver.exe')
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') { throw 'Invalid Edge WebDriver signature' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $driverDir
      - name: Pass WebView2 test arguments through machine policy
        # The runner is elevated, and WebView2 Runtime 150+ ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
        # for elevated hosts (MicrosoftEdge/WebView2Feedback#5640); only HKLM policy applies. Keep in sync
        # with offlineArguments in tests/desktop/smoke.mjs.
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -LiteralPath $key -Name 'luyen-jlpt-desktop.exe' -PropertyType String -Force `
            -Value '--remote-debugging-port=0 --proxy-server=127.0.0.1:9 --proxy-bypass-list=<-loopback>;tauri.localhost;ipc.localhost' | Out-Null
      - name: Install and check the Windows bundle
        shell: pwsh
        run: ./tests/desktop/ci-smoke.ps1
      - name: Prepare the Windows artifact
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: ./desktop/package-release.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native
          path: ${{ runner.temp }}/windows-native/
          if-no-files-found: error

  android-build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: ${{ inputs.publish && 'native-signing' || 'native-checks' }}
    env:
      ANDROID_BUILD_TOOLS_VERSION: 37.0.0
      ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Set up Android SDK for APK build
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager platform-tools 'platforms;android-36' 'platforms;android-37.0' "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          printf '%s\n' "ANDROID_HOME=$ANDROID_HOME" "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Verify Android contract and build the bundled frontend
        env:
          VITE_SUPABASE_URL: ${{ inputs.publish && vars.NATIVE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.publish && vars.NATIVE_SUPABASE_PUBLISHABLE_KEY || '' }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          if [[ "$PUBLISH" == true ]]; then node infra/scripts/src/validate-native-env.mjs; fi
          node --test tests/mobile/android-release.test.mjs
          pnpm --filter @luyen/frontend build
          pnpm packs:verify
          node mobile/scripts/validate-scaffold.mjs
      - name: Generate Android project
        run: |
          pnpm tauri:mobile android init --ci --skip-targets-install
          pnpm tauri:mobile icon app-icon.svg
      - name: Build debug APK for pull request smoke
        if: ${{ !inputs.publish }}
        run: pnpm tauri:mobile android build --ci --apk --debug --target x86_64 -- --locked
      - name: Build unsigned Android release APK
        if: ${{ inputs.publish }}
        run: pnpm tauri:mobile android build --ci --apk --target aarch64 armv7 x86_64 -- --locked
      - name: Sign the Android release APK and generate metadata
        if: ${{ inputs.publish }}
        env:
          ANDROID_RELEASE_SIGNING_ENABLED: 'true'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash mobile/scripts/package-release.sh
      - name: Stage Android artifacts for smoke and release
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/android-native"
          if [[ "$PUBLISH" == true ]]; then
            test -s "$output/Luyen-JLPT-android.apk"
            test -s "$output/android-latest.json"
          else
            mapfile -t apks < <(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk')
            test "${#apks[@]}" -eq 1
            test -s "${apks[0]}"
            mkdir -p "$output"
            cp "${apks[0]}" "$output/Luyen-JLPT-android-debug.apk"
          fi
      - run: git diff --exit-code -- mobile/src-tauri/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-native
          path: ${{ runner.temp }}/android-native/
          if-no-files-found: error

  android-smoke:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK and API 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v sdkmanager
          command -v avdmanager
          sdkmanager platform-tools emulator 'system-images;android-34;google_apis;x86_64'
          test -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/system.img"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          printf '%s\n' "ANDROID_HOME=$ANDROID_HOME" "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name luyen-jlpt --package 'system-images;android-34;google_apis;x86_64' --device pixel_5
          avd_config="$ANDROID_AVD_HOME/luyen-jlpt.avd/config.ini"
          # The emulator needs 1.2x this size free; 6G failed with 4122.48 MB left, and the smoke APK fits in 2G.
          sed -i 's/^disk\.dataPartition\.size[[:space:]]*=.*/disk.dataPartition.size=2G/' "$avd_config"
          grep -Fx 'disk.dataPartition.size=2G' "$avd_config"
          test -s "$ANDROID_AVD_HOME/luyen-jlpt.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx luyen-jlpt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-native
          path: ${{ runner.temp }}/android-native
      - name: Run Android offline smoke on the selected artifact
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        shell: bash
        run: |
          df -k -- "$ANDROID_AVD_HOME"
          bash tests/mobile/android-ci-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          name: android-emulator-log
          path: ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore

  publish:
    if: ${{ inputs.publish }}
    needs: [prepare, windows, android-build, android-smoke, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: native-production-release
      cancel-in-progress: false
    environment: native-publish
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-native'
          merge-multiple: true
          path: release
      - name: Publish Windows and Android together
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          DISTRIBUTION_REPO: VanHuynh205/Luyen-JLPT-Releases
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          target="$(gh api "repos/$DISTRIBUTION_REPO" --jq 'select(.private == false) | .default_branch')"
          test -n "$target"
          tag="v$VERSION"
          previous="$(gh api "repos/$DISTRIBUTION_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -1)"
          if [[ -n "$previous" ]]; then
            test "$tag" != "$previous"
            test "$(printf '%s\n' "$previous" "$tag" | sort -V | tail -1)" = "$tag"
          fi
          assets=(Luyen-JLPT-windows-x64-setup.exe Luyen-JLPT-windows-x64-setup.exe.sig latest.json Luyen-JLPT-android.apk android-latest.json)
          sha256sum -- "${assets[@]}" > SHA256SUMS.txt
          gh release create "$tag" "${assets[@]}" SHA256SUMS.txt --repo "$DISTRIBUTION_REPO" --target "$target" --title "Luyện JLPT $VERSION" --notes "Bộ cài Windows và Android. Đối chiếu SHA256SUMS.txt trước khi cài." --latest

  ios:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luyen/frontend build
      - run: pnpm packs:verify
      - name: Build the iOS Simulator app
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
          pnpm tauri:mobile ios init --ci --skip-targets-install
          pnpm tauri:mobile icon app-icon.svg
          pnpm tauri:mobile ios build --ci --debug --no-sign --target aarch64-sim
          git diff --exit-code -- mobile/src-tauri/Cargo.lock
      - name: Run the iOS N4 vocabulary smoke
        run: bash tests/mobile/ios/ci-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: ios-simulator-results
          path: ${{ runner.temp }}/ios-smoke/
          if-no-files-found: warn
